<!doctype html>
<!-- 仓库根的入口页。
     GitHub Pages 的发布源目前是仓库根（不是 /docs），而站点内容都在 docs/ 下 ——
     没有这一页，根路径就是 404。加了 .nojekyll 之后 Jekyll 不再拿 README 生成首页，
     所以这一页必须自己存在。
     Settings → Pages 把 Source 目录改成 /docs 之后，这一页不再被服务，留着也无害。 -->
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="refresh" content="0; url=docs/">
<title>每日一种野生动物</title></head>
<body><p>正在前往 <a href="docs/">每日一种野生动物</a>…</p></body></html>
